<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>PlayPort — Entertainment kits, delivered fast</title>
    <meta
      name="description"
      content="PlayPort — entertainment kits delivered fast. Consoles, cinema, VR and more at your door."
    />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="PlayPort" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlayPort" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://playport-one.vercel.app/" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayPort" />
    <meta property="og:title" content="PlayPort — Entertainment kits, delivered fast" />
    <meta
      property="og:description"
      content="Consoles, cinema, VR and more — sanitized kits to your door in minutes."
    />
    <meta property="og:url" content="https://playport-one.vercel.app/" />
    <meta property="og:image" content="https://playport-one.vercel.app/icon-512.png?v=3" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PlayPort — Entertainment kits, delivered fast" />
    <meta
      name="twitter:description"
      content="Consoles, cinema, VR and more — sanitized kits to your door in minutes."
    />
    <meta name="twitter:image" content="https://playport-one.vercel.app/icon-512.png?v=3" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0a0a0b;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run PlayPort.</noscript>
    <div id="root"></div>
  </body>
</html>
